<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Joel</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div id="overlay-container">
            <div id="spin-container">
                <div id="spin-header">AdRewards CHALLENGE&#8482;<br><small class="subtext">Stop the wheel to WIN!</small></div>
                <div class="arrow-down"></div>
                <div id="cardList"></div>
                <div id="speed-display">PROMO LEVEL: <span id="speed-value">---</span></div>
                <div id="near-miss-display"></div>
            </div>
            <div id="dialog">
                <div id="dialog-msg"></div>
            </div>
            <button id="skip">Skip Ad AND MORE With AdRewards&#8482;</button>
            <button id="skipCooldown">Next AdRewards&#8482; in</button>
            <button id="stopBtn">Stop</button>
            <audio id="heartbeatSound" src="heartbeat.wav" loop></audio>
            <audio id="clickSound" src="boom1.wav"></audio>
            <audio id="winnerAudio" src="you-won.mp3"></audio>
        </div>

        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/themes/base/jquery-ui.min.css">
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
        <script type="text/javascript">
            (function (window, document) {
                window.adSuccess = function () {
                    window.top.postMessage({
                        type: 'success'
                    }, '*');
                };
                const heartbeatAudio = document.getElementById('heartbeatSound');
                heartbeatAudio.volume = 0.8;
                const skipButton = document.getElementById('skip');
                const skipCooldown = document.getElementById('skipCooldown');
                const buttonAudio = document.getElementById('clickSound');
                var cooldownDuration = 10;
                skipCooldown.style.display = 'none';

                window.addEventListener('message', (event) => {
                    if (!event.data || !event.data.type) return;

                    if (event.data.type === 'adStarted') {
                        skipButton.style.display = 'block';
                    }
                    if (event.data.type === 'adFinished') {
                        skipButton.style.display = 'none';
                        window.top.postMessage({ type: 'fail' }, '*');
                    }
                });

                skipButton.addEventListener('click', () => {
                    skipButton.style.display = 'none';
                    openCase();
                    startCooldown();
                });

                var ODDS = {
                    worthless: { weight: 40, color: 'white', label: 'Blue' },
                    uncommon: { weight: 30, color: 'white', label: 'Green' },
                    skipAd: { weight: 10, color: 'white', label: 'Red' },
                    tease: { weight: 8, color: 'yellow', label: 'Yellow' }
                };

                var img = {
                    worthless: '<img src="images/coupon_code_5.png"/>',
                    uncommon: '<img src="images/coupon_code_10.png"/>',
                    skipAd: '<img src="images/skip_ad.png"/>',
                    tease: '<img src="images/apple_card.png"/>'
                };

                function random(min, max) {
                    return Math.floor((Math.random() * (max - min)) + min);
                }

                function makeFakeCouponCode() {
                    var result = "";
                    var characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890";
                    for (var i = 0; i < 25; i++) {
                        result += characters.charAt(random(0, characters.length));
                    }
                    return result;
                }

                function startCooldown() {
                    skipButton.style.display = 'none';
                    skipCooldown.style.display = 'block';
                    var timeLeft = cooldownDuration;
                    skipCooldown.textContent = "Next AdRewards\u2122 in " + timeLeft + " seconds";
                    var timer = setInterval(() => {
                        timeLeft--;
                        if (timeLeft <= 0) {
                            clearInterval(timer);
                            skipCooldown.style.display = 'none';
                            if (spinContainer.style.display !== 'block') {
                                skipButton.style.display = 'block';
                            }
                        } else {
                            skipCooldown.textContent = 'Next AdRewards\u2122 in ' + timeLeft + 's';
                        }
                    }, 1000);
                }

                function getWeightedRarity() {
                    var total = 0;
                    for (var rarity in ODDS) total += ODDS[rarity].weight;
                    var rand = Math.random() * total;
                    var cumulative = 0;
                    for (var rarity in ODDS) {
                        cumulative += ODDS[rarity].weight;
                        if (rand < cumulative) return rarity;
                    }
                    return 'worthless';
                }

                function getWinningRarity() {
                    var winningRarity;
                    do {
                        winningRarity = getWeightedRarity();
                    } while (winningRarity === 'tease');
                    return winningRarity;
                }

                // ===== SKILL-BASED CHAOS WHEEL =====
                var wheelPos = 0;
                var wheelSpeed = 0;
                var targetSpeed = 5;
                var isSpinning = false;
                var isDecelerating = false;
                var animFrameId = null;
                var cards = [];
                var chaosTimer = 0;
                var fakePauseTimer = 5000;
                var fakePausing = false;
                var lastTime = 0;
                var nearMissTimer = 0;
                var lastCenterIdx = -1;
                var tickPool = [];
                var tickPoolIdx = 0;
                var TICK_POOL_SIZE = 8;
                for (var t = 0; t < TICK_POOL_SIZE; t++) {
                    var tick = new Audio('click.wav');
                    tick.volume = 0.15;
                    tickPool.push(tick);
                }

                var CARD_WIDTH = 102;
                var CONTAINER_WIDTH = 800;
                var TOTAL_CARDS = 400;

                var stopBtnEl = document.getElementById('stopBtn');
                var speedDisplay = document.getElementById('speed-value');
                var spinContainer = document.getElementById('spin-container');
                var cardListEl = document.getElementById('cardList');
                var nearMissDisplay = document.getElementById('near-miss-display');
                var arrowEl = document.querySelector('.arrow-down');

                var nearMissMessages = [
                    'SO CLOSE! Try again!',
                    'Almost had the gift card!',
                    'Oof, just missed it!',
                    'RNG hates you!',
                    'Skill issue detected.',
                    'The wheel has spoken.',
                    'Maybe next time... kidding.',
                    'Your finger slipped!',
                    'So close it hurts!',
                    'AdRewards\u2122 regrets to inform you...'
                ];

                function generateCards() {
                    cards = [];
                    for (var i = 0; i < TOTAL_CARDS; i++) {
                        cards.push({ rarity: getWeightedRarity(), index: i });
                    }
                    // sprinkle extra tease items to torment
                    for (var j = 0; j < 12; j++) {
                        var pos = random(15, TOTAL_CARDS - 15);
                        cards[pos].rarity = 'tease';
                    }
                }

                function buildCardList() {
                    cardListEl.innerHTML = '';
                    for (var i = 0; i < cards.length; i++) {
                        var cardData = ODDS[cards[i].rarity];
                        var extraClass = cards[i].rarity === 'tease' ? ' tease' : '';
                        var el = document.createElement('div');
                        el.className = 'card' + extraClass;
                        el.style.backgroundColor = cardData.color;
                        el.setAttribute('data-rarity', cards[i].rarity);
                        el.id = 'itemNumber' + i;
                        el.innerHTML = img[cards[i].rarity];
                        cardListEl.appendChild(el);
                    }
                }

                function getCardAtCenter() {
                    var centerPixel = wheelPos + CONTAINER_WIDTH / 2;
                    var idx = Math.floor(centerPixel / CARD_WIDTH);
                    if (idx < 0) idx = 0;
                    if (idx >= TOTAL_CARDS) idx = TOTAL_CARDS - 1;
                    return idx;
                }

                function getCenterCardRarity() {
                    var idx = getCardAtCenter();
                    return cards[idx] ? cards[idx].rarity : 'worthless';
                }

                function isTeaseNearby(range) {
                    var centerIdx = getCardAtCenter();
                    for (var i = centerIdx - range; i <= centerIdx + range; i++) {
                        if (i >= 0 && i < TOTAL_CARDS && cards[i].rarity === 'tease') {
                            return true;
                        }
                    }
                    return false;
                }

                function updateSpeed(dt) {
                    if (!isSpinning) return;

                    chaosTimer -= dt;
                    fakePauseTimer -= dt;

                    // fake pause: brief slowdown to bait clicks
                    if (!fakePausing && fakePauseTimer <= 0 && Math.random() < 0.008) {
                        fakePausing = true;
                        fakePauseTimer = 150 + Math.random() * 400;
                        targetSpeed = 0.3 + Math.random() * 1;
                    }
                    if (fakePausing && fakePauseTimer <= 0) {
                        fakePausing = false;
                        targetSpeed = 4 + Math.random() * 6;
                        chaosTimer = 200 + Math.random() * 600;
                    }

                    // chaos speed changes
                    if (!fakePausing && chaosTimer <= 0) {
                        var roll = Math.random();
                        if (roll < 0.15) {
                            targetSpeed = 7 + Math.random() * 9;
                        } else if (roll < 0.30) {
                            targetSpeed = 0.5 + Math.random() * 1.5;
                        } else if (roll < 0.42) {
                            targetSpeed = -(4 + Math.random() * 6);
                        } else if (roll < 0.50) {
                            targetSpeed = (Math.random() - 0.5) * 17;
                        } else {
                            targetSpeed = 2.5 + Math.random() * 5;
                        }
                        chaosTimer = 150 + Math.random() * 1800;
                    }

                    // tease proximity: BOLT past it
                    if (isTeaseNearby(2)) {
                        var dir = wheelSpeed >= 0 ? 1 : -1;
                        if (Math.abs(targetSpeed) < 7) {
                            targetSpeed = dir * (8 + Math.random() * 5);
                        }
                    }

                    // lerp toward target speed
                    var lerpRate = isDecelerating ? 0.006 : 0.05;
                    wheelSpeed += (targetSpeed - wheelSpeed) * lerpRate;

                    // deceleration
                    if (isDecelerating) {
                        wheelSpeed *= 0.97;
                        // random micro-jolts while stopping
                        wheelSpeed += (Math.random() - 0.5) * 1;
                        if (Math.abs(wheelSpeed) < 0.06) {
                            wheelSpeed = 0;
                            isSpinning = false;
                            isDecelerating = false;
                            onWheelStopped();
                            return;
                        }
                    }

                    wheelPos += wheelSpeed;

                    // boundary bounce
                    var maxScroll = TOTAL_CARDS * CARD_WIDTH - CONTAINER_WIDTH;
                    if (wheelPos < 0) {
                        wheelPos = 0;
                        wheelSpeed = Math.abs(wheelSpeed) * 0.5 + 2;
                        chaosTimer = 0;
                    }
                    if (wheelPos > maxScroll) {
                        wheelPos = maxScroll;
                        wheelSpeed = -(Math.abs(wheelSpeed) * 0.5 + 2);
                        chaosTimer = 0;
                    }
                }

                function renderWheel() {
                    cardListEl.scrollLeft = Math.round(wheelPos);

                    var centerIdx = getCardAtCenter();
                    if (centerIdx !== lastCenterIdx) {
                        lastCenterIdx = centerIdx;
                        tickPool[tickPoolIdx].currentTime = 0;
                        tickPool[tickPoolIdx].play();
                        tickPoolIdx = (tickPoolIdx + 1) % TICK_POOL_SIZE;
                    }

                    var absSpeed = Math.abs(wheelSpeed);
                    var dangerLevel;
                    if (absSpeed > 12) dangerLevel = 'MAXIMUM';
                    else if (absSpeed > 8) dangerLevel = 'CRITICAL';
                    else if (absSpeed > 4) dangerLevel = 'HIGH';
                    else if (absSpeed > 2) dangerLevel = 'MEDIUM';
                    else if (absSpeed > 0.4) dangerLevel = 'LOW';
                    else dangerLevel = 'STOPPED';
                    speedDisplay.textContent = dangerLevel;
                    speedDisplay.className = 'speed-' + dangerLevel.toLowerCase();

                    

                    // arrow flash near tease
                    if (arrowEl) {
                        if (isTeaseNearby(1)) {
                            arrowEl.style.borderTopColor = '#ff0';
                            arrowEl.style.transform = 'scale(1.4)';
                        } else {
                            arrowEl.style.borderTopColor = '#f00';
                            arrowEl.style.transform = 'scale(1)';
                        }
                    }

                    // near miss taunt timer
                    if (nearMissTimer > 0) {
                        nearMissTimer -= 16;
                        if (nearMissTimer <= 0) {
                            nearMissDisplay.textContent = '';
                        }
                    }
                }

                function openCase() {
                    document.getElementById('spin-container').style.display = 'block';
                    heartbeatAudio.play();

                    generateCards();
                    buildCardList();

                    wheelPos = 500 + Math.random() * 2000;
                    wheelSpeed = 4 + Math.random() * 2;
                    targetSpeed = wheelSpeed;
                    isSpinning = true;
                    isDecelerating = false;
                    chaosTimer = 800;
                    fakePauseTimer = 2500 + Math.random() * 1500;
                    fakePausing = false;
                    nearMissTimer = 0;
                    nearMissDisplay.textContent = '';
                    lastCenterIdx = -1;

                    stopBtnEl.style.display = 'block';

                    lastTime = performance.now();
                    animFrameId = requestAnimationFrame(gameLoop);
                }

                function gameLoop(timestamp) {
                    var dt = timestamp - lastTime;
                    lastTime = timestamp;
                    if (dt > 100) dt = 16;

                    if (!isSpinning && !isDecelerating) return;

                    updateSpeed(dt);
                    renderWheel();

                    if (isSpinning || isDecelerating) {
                        animFrameId = requestAnimationFrame(gameLoop);
                    }
                }

                stopBtnEl.addEventListener('click', () => {
                    buttonAudio.pause();
                    buttonAudio.currentTime = 0;
                    buttonAudio.play();
                    if (!isSpinning || isDecelerating) return;
                    stopBtnEl.style.display = 'none';

                    // slip the wheel when near tease (IMPOSSIBLE to win tease)
                    var slipAmount = 0;
                    if (isTeaseNearby(4)) {
                        var slipDir = wheelSpeed >= 0 ? 1 : -1;
                        slipAmount = slipDir * CARD_WIDTH * (2 + Math.random() * 4);
                        nearMissDisplay.textContent = nearMissMessages[random(0, nearMissMessages.length)];
                        nearMissTimer = 3000;
                    }

                    // random reaction delay (CHAOS)
                    var stopDelay = 60 + Math.random() * 350;
                    setTimeout(() => {
                        wheelPos += slipAmount;
                        // one last chaos jolt
                        wheelSpeed += (Math.random() - 0.3) * 6;
                        isDecelerating = true;
                    }, stopDelay);
                });

                function onWheelStopped() {
                    heartbeatAudio.pause();
                    heartbeatAudio.currentTime = 0;
                    if (animFrameId) cancelAnimationFrame(animFrameId);
                    spinContainer.style.transform = 'translate(-50%, -50%)';

                    var centerIdx = getCardAtCenter();
                    var rarity = cards[centerIdx] ? cards[centerIdx].rarity : 'worthless';

                    // absolutely guarantee tease is unwinnable
                    if (rarity === 'tease') {
                        centerIdx += (wheelSpeed >= 0 ? 1 : -1);
                        centerIdx = Math.max(0, Math.min(TOTAL_CARDS - 1, centerIdx));
                        rarity = cards[centerIdx].rarity;
                        if (rarity === 'tease') rarity = 'worthless';
                        nearMissDisplay.textContent = nearMissMessages[random(0, nearMissMessages.length)];
                    }

                    var src = $('#itemNumber' + centerIdx + ' img').attr('src');
                    $('#itemNumber' + centerIdx).css({ background: "linear-gradient(#00bf09, #246b27)" });

                    const winAudio = document.getElementById("winnerAudio");
                    winAudio.pause();
                    winAudio.play();

                    if (rarity === "worthless" || rarity === "uncommon") {

                        var couponCode = makeFakeCouponCode();
                        $('#dialog-msg').html("You have received " + ODDS[rarity].label + " item!" + "<br><img src=" + src + ">" + "<br> Your AdRewards Discount Code: <br>" + "<h3>" + couponCode + "</h3>");
                        $('#dialog').dialog({
                            modal: true,
                            title: "Ad Reward!",
                            resizable: false,
                            draggable: false,
                            width: 400,
                            closeOnEscape: false,
                            open: function (event, ui) {
                                $('.ui-dialog-titlebar-close', $(this).parent()).hide();
                                confetti();
                            },
                            buttons: {
                                "Claim AdRewards\u2122 Reward": function () {
                                    $(this).dialog("close");
                                    document.getElementById('spin-container').style.display = 'none';
                                    if (skipCooldown.style.display !== 'block') skipButton.style.display = 'block';
                                }
                            }
                        });
                    } else if (rarity === "skipAd") {
                        $('#dialog-msg').html("Congragulations!" + "<br><img src=" + src + ">");
                        $('#dialog').dialog({
                            modal: true,
                            title: "Ad Reward!",
                            resizable: false,
                            draggable: false,
                            width: 400,
                            closeOnEscape: false,
                            open: function (event, ui) {
                                $('.ui-dialog-titlebar-close', $(this).parent()).hide();
                                confetti();
                            },
                            buttons: {
                                "Claim AdRewards\u2122 Reward": function () {
                                    $(this).dialog("close");
                                    document.getElementById('spin-container').style.display = 'none';
                                    window.adSuccess();
                                }
                            }
                        });
                    }
                }
            })(window, document);
        </script>
    </body>
</html>
